<!DOCTYPE html>
<html>
<head>
    <title>SBA BLOPPERS</title>

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:linear-gradient(135deg,#1e3c72,#2a5298);
            color:white;
            text-align:center;
        }

        h1{
            margin-top:40px;
            font-size:50px;
            animation:glow 2s infinite alternate;
        }

        @keyframes glow{
            from{
                text-shadow:0 0 10px white;
            }
            to{
                text-shadow:0 0 25px yellow;
            }
        }

        .container{
            display:flex;
            justify-content:center;
            gap:30px;
            flex-wrap:wrap;
            margin-top:50px;
        }

        .card{
            background:white;
            color:black;
            width:250px;
            padding:20px;
            border-radius:20px;
            box-shadow:0 0 20px rgba(0,0,0,0.3);
            transition:0.4s;
        }

        .card:hover{
            transform:scale(1.08);
        }

        .name{
            font-size:28px;
            font-weight:bold;
            color:#2a5298;
        }

        .desc{
            margin-top:10px;
            font-size:20px;
        }

        .end{
            margin-top:100px;
            margin-bottom:50px;
            font-size:28px;
            font-weight:bold;
            animation:float 2s infinite alternate;
        }

        @keyframes float{
            from{
                transform:translateY(0);
            }
            to{
                transform:translateY(-10px);
            }
        }
    </style>
</head>

<body>

    <h1>SBA BLOPPERS 😂</h1>

    <div class="container">

        <div class="card">
            <div class="name">POL</div>
            <div class="desc">😈 Naughty</div>
        </div>

        <div class="card">
            <div class="name">HOK</div>
            <div class="desc">🧠 He Knows</div>
        </div>

        <div class="card">
            <div class="name">RISHI</div>
            <div class="desc">😊 Humble</div>
        </div>

    </div>

    <div class="end">
        🎉 You Arrived At The End 🎉
    </div>

</body>
</html>
